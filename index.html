<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nhậu Online 34 — Vỉa Hè 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#161e26;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}#hud>*{pointer-events:auto}.badge{background:#151b23d9;border:1px solid #e4c77a;border-radius:12px;padding:8px 10px;font-size:12px}button,select{background:#a82724;color:#fff;border:1px solid #f2ce7a;border-radius:12px;padding:11px;font-weight:700;font-size:14px}#actions{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:12px;display:flex;flex-direction:column;gap:8px}#stick{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:24px;width:138px;height:138px;border:2px solid #ffffff77;border-radius:50%;background:#ffffff22;touch-action:none}#knob{position:absolute;left:44px;top:44px;width:46px;height:46px;background:#f6d77dcc;border-radius:50%;border:2px solid white}#panel{position:fixed;top:70px;left:10px;right:10px;max-width:390px;background:#152018ef;padding:15px;border:1px solid #e3bc60;border-radius:15px;display:none}#panel.show{display:block}#panel select{width:100%;margin:7px 0}#tip{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);background:#222c2cdb;padding:8px 14px;border-radius:10px;white-space:nowrap;font-size:13px}#loading{position:fixed;inset:0;background:#1a2729;display:grid;place-items:center;text-align:center;z-index:9;padding:25px}#loading.hidden{display:none}#err{color:#ffb4a4;font-size:13px}</style></head><body><div id="loading"><div><h2>🇻🇳 NHẬU ONLINE 34 🍻</h2><p>Đang dựng quán nhậu vỉa hè 3D...</p><p id="err">Cần kết nối Internet để tải thư viện đồ họa.</p></div></div><div id="hud"><div class="badge">🇻🇳 <b>NHẬU ONLINE 34</b><br>Vỉa hè 3D • Bản chơi thử<br><span id="status">1/34 • Chơi một mình</span></div><button id="wardrobe">👕 Trang phục</button></div><div id="panel"><b>Chọn trang phục Việt Nam</b><select id="outfit"><option value="0">Áo cờ đỏ sao vàng 🇻🇳</option><option value="1">Áo dài truyền thống</option><option value="2">Áo bà ba</option><option value="3">Áo ba lỗ, quần đùi</option><option value="4">Đồ vịt vàng bựa 🦆</option><option value="5">Đồ múa lân 🐉</option></select><p style="font-size:12px">Mô hình nhân vật 3D đơn giản, chưa phải nhân vật người thật.</p><button id="close">Đóng</button></div><div id="stick"><div id="knob"></div></div><div id="actions"><button id="sit">🪑 Ngồi</button><button id="cheer">🍻 Cụng ly</button><button id="food">🍲 Gọi món</button><button id="jump">⬆️ Nhảy</button></div><div id="tip">🕹️ Kéo joystick để đi quanh quán</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x273e59);scene.fog=new THREE.Fog(0x273e59,35,85);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe8bd,0x26344c,2.1));const sun=new THREE.DirectionalLight(0xffd49a,2.4);sun.position.set(-8,17,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const M={road:mat(0x343b40),walk:mat(0x98988c),red:mat(0xc92523),yellow:mat(0xffdf32),metal:mat(0x9eaeb0),wood:mat(0x77513c),blue:mat(0x2382b4),green:mat(0x24845a),skin:mat(0xe2aa80),hair:mat(0x1e1613),white:mat(0xf7f0e1),black:mat(0x242426),glass:mat(0xdba748)};function box(w,h,d,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}function cyl(r1,r2,h,m,x,y,z,group=scene,n=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}box(90,.15,40,M.road,0,-.2,-15);box(90,.18,24,M.walk,0,-.05,11);box(90,.2,.3,M.white,0,.05,-1);for(let i=-40;i<40;i+=6)box(3,.02,.13,M.yellow,i,-.11,-11);for(let i=-30;i<35;i+=10){box(5,6,5,mat(i%20===0?0x51687c:0x77695d),i,3,21);box(5.2,.4,1.8,M.red,i,4.4,18);box(5.2,.5,.15,M.yellow,i,3.7,18)}

box(.09,5,.09,M.wood,-15,2.5,1);box(2.8,1.7,.08,M.red,-13.6,4.4,1);const starShape=new THREE.Shape();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?.31:.75;let x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)starShape.moveTo(x,y);else starShape.lineTo(x,y)}starShape.closePath();let star=new THREE.Mesh(new THREE.ShapeGeometry(starShape),new THREE.MeshBasicMaterial({color:0xffdc24,side:THREE.DoubleSide}));star.position.set(-13.6,4.4,1.06);scene.add(star);

function avatar(){let g=new THREE.Group();let torso=box(.8,1,.44,M.red,0,1.55,0,g),pants=box(.75,.7,.43,M.black,0,.7,0,g);let head=cyl(.32,.3,.55,M.skin,0,2.38,0,g,16),hair=cyl(.33,.32,.18,M.hair,0,2.72,0,g,16);let arms=[],legs=[];for(let s of [-1,1]){let a=box(.22,.85,.25,M.skin,s*.55,1.47,0,g);arms.push(a);let l=box(.27,.72,.3,M.black,s*.23,.38,0,g);legs.push(l)}let eye1=box(.06,.06,.04,M.black,-.12,2.42,-.3,g),eye2=box(.06,.06,.04,M.black,.12,2.42,-.3,g);return {g,torso,pants,head,hair,arms,legs}}const player=avatar();scene.add(player.g);player.g.position.set(0,0,0);const outfits=[0xc92827,0xe8d8bc,0x493d77,0xf6e3b7,0xffd72c,0x30a4a0];function dress(i){player.torso.material=mat(outfits[i]);player.pants.material=mat(i===3?0x4974a1:i===4?0xf4cc23:0x272b36);player.hair.material=mat(i===4?0xffd72c:0x1e1613)}document.getElementById('outfit').onchange=e=>dress(+e.target.value);
let joy={x:0,y:0},moving=false,walking=0,seated=false,jump=0,noticeTimer;const stick=document.getElementById('stick'),knob=document.getElementById('knob');function updateStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),max=43,scale=Math.min(len,max)/len;dx*=scale;dy*=scale;knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/max;joy.y=dy/max}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moving=true;updateStick(e)});stick.addEventListener('pointermove',e=>{if(moving)updateStick(e)});function stop(){moving=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);let keys={};window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
